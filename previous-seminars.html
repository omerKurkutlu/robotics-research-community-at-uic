<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Seminars | Robotics Research Community at UIC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(180deg, #fffdfb 0%, #eff4fa 100%);
            color: #1d2430;
        }

        .gallery-page {
            padding: 5rem 0 4rem;
        }

        .gallery-header {
            margin-bottom: 2rem;
        }

        .section-label {
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.76rem;
            color: #d50032;
            font-weight: 700;
        }

        .gallery-shell {
            margin-top: 2rem;
        }

        .gallery-stage {
            position: relative;
            overflow: hidden;
            padding: 0.5rem 0 1rem;
        }

        .gallery-track {
            display: flex;
            gap: 1rem;
            transition: transform 0.45s ease;
            will-change: transform;
            min-height: 500px;
        }

        .gallery-item {
            display: block;
            width: 100%;
            min-width: 100%;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(8, 29, 66, 0.08);
            background: #fff;
            box-shadow: 0 10px 26px rgba(8, 29, 66, 0.08);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            flex: 0 0 100%;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 36px rgba(8, 29, 66, 0.12);
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 520px;
            object-fit: contain;
            background: #eef4fb;
        }

        .gallery-caption {
            padding: 1rem 1rem 1.1rem;
            font-size: 0.92rem;
            color: #1d2430;
            font-weight: 600;
            white-space: normal;
        }

        .gallery-thumbs {
            display: flex;
            gap: 0.7rem;
            overflow-x: auto;
            padding: 0.8rem 0 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(8, 29, 66, 0.3) transparent;
        }

        .gallery-thumbs .thumb {
            width: 96px;
            height: 68px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: opacity 0.2s ease, border-color 0.2s ease;
            flex: 0 0 auto;
            cursor: pointer;
        }

        .gallery-thumbs .thumb.active {
            border-color: #d50032;
            opacity: 1;
        }

        .empty-state {
            padding: 2rem;
            border-radius: 16px;
            background: rgba(213, 0, 50, 0.05);
            color: #1d2430;
            border: 1px solid rgba(213, 0, 50, 0.12);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark uic-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                Robotics Research Community @ UIC
            </a>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#seminars">Seminars</a></li>
                    <li class="nav-item"><a class="nav-link" href="faculty-labs.html">Faculty &amp; Research Labs</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link active" href="previous-seminars.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#mission">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="gallery-page">
        <div class="container">
            <div class="gallery-header">
                <span class="section-label">Archive</span>
                <h1 class="fw-bold mt-2 display-5">Previous Seminars</h1>
            </div>

            <div id="previous-seminars-gallery" class="gallery-shell" aria-live="polite"></div>
        </div>
    </main>

    <script src="js/previous-seminars.js"></script>
</body>
</html>
